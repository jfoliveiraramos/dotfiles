# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

palette = 'ramos'

[palettes.ramos]
white = "#dcd7ba"  # 15
red = "#ffaf5f"    # 9
purple = "#ffaf5f" # 13
yellow = "#ffaf5f" # 11
accent = "#ffaf5f" # 7
orange = "#ffaf5f" # 3

[character]
success_symbol = '[❯](bold orange)'

[directory]
style = 'bold accent'

[git_branch]
style = 'bold orange'

[git_status]
style = 'bold accent'

[conda]
style = 'bold orange'
ignore_base = true

[lua]
style = 'bold purple'

[package]
style = 'bold orange'

[zig]
symbol = '⚡️ '
style = 'bold yellow'

[cmd_duration]
min_time = 500
format = 'underwent [$duration](bold white)'
